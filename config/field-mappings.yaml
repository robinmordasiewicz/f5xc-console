# ==============================================================================
# APP_FIREWALL Resource Mappings
# ==============================================================================
app_firewall:
  description: "F5 XC App Firewall (WAF) policy resource"
  api_type: "ves.io.schema.app_firewall.Object"
  formUrl: "/web/workspaces/web-app-and-api-protection/namespaces/{namespace}/manage/app_firewall"
  formTitle: "Create App Firewall"

  # Common fields (always present regardless of discriminator selections)
  common_fields:
    # Metadata fields
    name: "metadata.name"
    labels: "metadata.labels"
    description: "metadata.description"

  # Discriminator fields for oneOf detection
  discriminator_fields:
    # Detection settings mode
    detection_settings:
      "Default Detection Settings": "default_detection_settings"
      "Custom Detection Settings": "detection_settings"

    # Blocking mode
    blocking:
      "Block": "blocking"
      "Disable": "disable_blocking"

    # Bot defense mode
    bot_defense:
      "Disable Bot Defense": "bot_defense_basic"
      "Enable Bot Defense": "bot_defense_config"

  # Nested configurations for discriminator options
  nested_configs:
    # Custom detection settings
    detection_settings:
      signature_selection: "detection_settings.signature_selection"
      violation_settings: "detection_settings.violation_settings"
      attack_type_settings: "detection_settings.attack_type_settings"
      threat_campaign_settings: "detection_settings.threat_campaign_settings"

    # Blocking page customization
    blocking_page:
      custom_blocking_page: "blocking_page.custom_blocking_page"
      blocking_page_body: "blocking_page.blocking_page_body"

    # Bot defense configuration
    bot_defense_config:
      bot_javascript_mode: "bot_defense_config.bot_javascript_mode"
      bot_grace_period: "bot_defense_config.bot_grace_period"

  # Validation rules for API property paths
  validation:
    required_api_fields:
      - "metadata.name"

    mutually_exclusive:
      - ["default_detection_settings", "detection_settings"]
      - ["blocking", "disable_blocking"]
      - ["bot_defense_basic", "bot_defense_config"]

