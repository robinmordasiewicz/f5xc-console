# Field Mappings: UI → API Property Paths
#
# Maps F5 XC Console UI field names to their corresponding API property paths.
# This bridges the gap between human-friendly UI labels and machine-readable API schemas.
#
# Format:
#   resource_type:
#     common_fields:         # Always mapped regardless of form state
#       ui_field_name: "api.property.path"
#     discriminator_fields:  # Conditional mappings based on dropdown selections
#       ui_field_name:
#         option_value: "api.property.path"
#     nested_configs:        # Mappings within nested configuration dialogs
#       trigger_field_name:
#         ui_field_name: "api.property.path"

version: "3.0"
last_updated: "2026-01-25"

# ==============================================================================
# Global Defaults Configuration
# ==============================================================================
defaults:
  extraction:
    maxNestingDepth: 3
    domStabilizationTimeout: 500
    captureScreenshots: false
    validateSchema: true
    expandAdvancedFields: true
    extractNestedConfigs: true

  export:
    outputDir: "./schemas"
    includeSelectors: true
    includeReport: true

# ==============================================================================
# Global API References Configuration
# ==============================================================================
# Top-level API reference configuration shared across resources
# Defines how to fetch dynamic enum values from F5 XC API with fallback to placeholders
api_references:
  healthcheck:
    api_path: "/api/config/namespaces/{namespace}/healthchecks"
    value_field: "name"
    cacheable: true
    cache_ttl: 300  # 5 minutes in seconds
    placeholder_fallback: ["healthcheck-1", "healthcheck-2", "example-hc"]
    description: "Health Check resource references for origin pools"

  app_firewall:
    api_path: "/api/config/namespaces/{namespace}/app_firewalls"
    value_field: "name"
    cacheable: true
    cache_ttl: 300  # 5 minutes in seconds
    placeholder_fallback: ["app-firewall-1", "app-firewall-2", "example-waf"]
    description: "App Firewall policy references for HTTP load balancers"

# ==============================================================================
# HEALTHCHECK Resource Mappings
# ==============================================================================
healthcheck:
  description: "F5 XC Health Check resource"
  api_type: "ves.io.schema.healthcheck.Object"

  # Common fields (always present, regardless of health check type)
  common_fields:
    # Metadata fields
    name: "metadata.name"
    labels: "metadata.labels"
    description: "metadata.description"

    # Disabled field (not shown in UI, always false)
    disable: "metadata.disable"

    # Common health check configuration
    timeout: "timeout"
    interval: "interval"
    unhealthy_threshold: "unhealthy_threshold"
    healthy_threshold: "healthy_threshold"
    jitter_percent: "jitter_percent"

    # Advanced fields
    show_advanced_fields: "__ui_only__"  # Special marker: UI-only field

  # Discriminator field: "Health Check Type" dropdown
  discriminator_fields:
    health_check:
      # UI option → API property mapping
      "HTTP HealthCheck": "http_health_check"
      "TCP HealthCheck": "tcp_health_check"
      "ICMP HealthCheck": "icmp_ping_health_check"

  # Nested configuration mappings
  nested_configs:
    # HTTP Health Check nested configuration
    http_health_check:
      path: "http_health_check.path"
      use_http2: "http_health_check.use_http2"
      request_headers_to_add: "http_health_check.request_headers_to_add"
      expected_status_codes: "http_health_check.expected_status_codes"

      # Nested discriminator: "Host Header" dropdown
      __discriminator__:
        field: "specify_host_header"
        mappings:
          "Origin Server Name": "http_health_check.host_header"
          "Custom Value": "http_health_check.host_header"

      # Host Header custom value
      host_header_value: "http_health_check.host_header"

    # TCP Health Check nested configuration
    tcp_health_check:
      send_payload: "tcp_health_check.send_payload.text"
      receive_payload: "tcp_health_check.receive_payload"

    # ICMP Ping Health Check (no nested config typically)
    icmp_ping_health_check: {}

  # Special field transformations
  transformations:
    # Array-type fields that need special handling
    expected_status_codes:
      type: "array"
      item_type: "string"
      ui_format: "comma_separated"  # "200, 201, 204" → ["200", "201", "204"]

    request_headers_to_add:
      type: "array"
      item_type: "object"
      ui_format: "key_value_pairs"  # [{name: "X-Header", value: "val"}]

  # Validation rules for API property paths
  validation:
    required_api_fields:
      - "metadata.name"
      - "timeout"
      - "interval"
      - "unhealthy_threshold"
      - "healthy_threshold"

    mutually_exclusive:
      - ["http_health_check", "tcp_health_check", "icmp_ping_health_check"]

# ==============================================================================
# ORIGIN_POOL Resource Mappings (Unified Comprehensive Implementation)
# ==============================================================================
origin_pool:
  description: "F5 XC Origin Pool resource - unified comprehensive schema extraction"
  api_type: "ves.io.schema.views.origin_pool.Object"
  formUrl: "/web/app/namespaces/{namespace}/origin_pools/create"
  formTitle: "Create Origin Pool"

  # Common fields (always present regardless of discriminator selections)
  common_fields:
    # Metadata fields
    name: "metadata.name"
    labels: "metadata.labels"
    description: "metadata.description"

    # Origin pool specific fields
    port: "port"

  # Discriminator fields for oneOf detection
  # These create mutually exclusive configuration options
  discriminator_fields:
    # TLS configuration (no_tls ↔ use_tls)
    tls_configuration:
      "Disable TLS": "no_tls"
      "Enable TLS": "use_tls"

    # Load balancer algorithm options
    loadbalancer_algorithm:
      "Round Robin": "loadbalancer_algorithm.round_robin"
      "Least Active": "loadbalancer_algorithm.least_active"
      "Ring Hash": "loadbalancer_algorithm.ring_hash"
      "Random": "loadbalancer_algorithm.random"

  # Array fields (repeating configuration blocks)
  # Origin servers are a dynamic table with "Add Item" button
  array_fields:
    origin_servers:
      api_property: "origin_servers"
      min_items: 1
      max_items: 100
      add_button_text: "Add Item"
      item_discriminator: "origin_server_type"
      description: "Repeating origin server configuration blocks with type-specific fields"

      # Item types with discriminated union (triple nesting: Pool → Servers → Type Config)
      item_types:
        public_dns_name:
          api_path: "origin_servers[].public_name"
          fields:
            dns_name: "dns_name"
          required: ["dns_name"]
          description: "Public DNS name configuration"

        k8s_service:
          api_path: "origin_servers[].k8s_service"
          fields:
            service_name: "service_name"
            site_locator: "site_locator"
            vk8s_networks: "vk8s_networks"
          required: ["service_name"]
          description: "Kubernetes service configuration"

        private_ip:
          api_path: "origin_servers[].private_name"
          fields:
            ip_address: "ip"
            site_locator: "site_locator"
            inside_network: "inside_network"
            outside_network: "outside_network"
          required: ["ip_address"]
          description: "Private IP address configuration"

  # API reference fields (dynamic enums from F5 XC API)
  # These fields fetch their dropdown options from the API at extraction time
  reference_fields:
    health_check:
      type: "api_reference"
      api_property: "healthcheck"
      reference_type: "healthcheck"
      required: false
      description: "Reference to existing Health Check resource"
      fallback_behavior: "use_placeholder"  # Use global api_references.healthcheck.placeholder_fallback

  # Nested configurations for discriminator options
  nested_configs:
    # Load balancer algorithm nested configurations
    round_robin:
      # No additional config for round robin
      {}

    least_active:
      # No additional config for least active
      {}

    ring_hash:
      hash_policy: "loadbalancer_algorithm.ring_hash.hash_policy"

    random:
      # No additional config for random
      {}

    # TLS configuration nested settings
    use_tls:
      tls_config: "use_tls.tls_config"
      sni: "use_tls.sni"
      skip_server_verification: "use_tls.skip_server_verification"

    no_tls:
      # No additional config for no_tls
      {}

  # Validation rules for API property paths
  validation:
    required_api_fields:
      - "metadata.name"
      - "port"
      - "origin_servers"  # At least one origin server required

    mutually_exclusive:
      - ["no_tls", "use_tls"]
      - ["loadbalancer_algorithm.round_robin", "loadbalancer_algorithm.least_active", "loadbalancer_algorithm.ring_hash", "loadbalancer_algorithm.random"]

    # Field-level validation
    field_constraints:
      port:
        type: "integer"
        min: 1
        max: 65535
      origin_servers:
        min_items: 1
        max_items: 100

# ==============================================================================
# LOAD_BALANCER Resource Mappings (Example for future expansion)
# ==============================================================================
load_balancer:
  description: "F5 XC HTTP Load Balancer resource"
  api_type: "ves.io.schema.views.http_loadbalancer.Object"

  common_fields:
    name: "metadata.name"
    labels: "metadata.labels"
    description: "metadata.description"
    domains: "domains"

  discriminator_fields:
    advertise_on_public_default_vip:
      "Advertise": "advertise_on_public_default_vip"
